# Default values for kellnr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# For more than 1 replica, it is recommended
# to set the "cookieSigningKey", to share auth.
# cookies for the UI between the replicas.
replicaCount: 1

strategy:
  type: "RollingUpdate"
  rollingUpdate:
    maxSurge: "100%"
    maxUnavailable: 0

image:
  repository: ghcr.io/kellnr/kellnr
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "kellnr"
fullnameOverride: "kellnr"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "kellnr"
  # Kellnr does not talk to the Kubernetes API, so its token is not mounted by default.
  automountServiceAccountToken: false

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

# The Kellnr image starts as root to trust imported certificates and to take
# over volumes written by older (root) images, then switches to the
# unprivileged "kellnr" user (uid 1000). That needs CHOWN, SETUID and SETGID.
# Without them Kellnr keeps running as root and logs a warning. To run fully
# non-root instead, drop the "add" list and set podSecurityContext to
# runAsUser/runAsGroup/fsGroup 1000 (fsGroup does not apply to hostPath PVs).
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID

# Health probes against Kellnr's /api/v1/health endpoint.
# The startup probe gates liveness/readiness until the app is up
# (failureThreshold * periodSeconds = max startup time).
# An empty path defaults to "<path prefix>/api/v1/health", see kellnr.origin.path.
startupProbe:
  enabled: true
  path: ""
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
livenessProbe:
  enabled: true
  path: ""
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  enabled: true
  path: ""
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

deployment:
  volumes:
    name: "kellnr-storage"
    persistentVolumeClaim: "kellnr"

# Name of the ConfigMap holding the non-sensitive Kellnr configuration.
configMap:
  name: "kellnr-config"

# The chart always stores the sensitive Kellnr configuration (admin password
# and token, cookie signing key, S3 keys, OAuth2 client secret) in a Secret,
# separate from the non-sensitive ConfigMap above. Both are mounted into the pod.
secret:
  name: "kellnr-secret"
  # Reference an existing Secret holding the sensitive Kellnr env vars instead of
  # letting the chart create one. Useful when managing secrets with tools like SOPS.
  # When set, the chart does not render its own Secret and mounts this one instead.
  # The Secret must contain the relevant KELLNR_* environment variables.
  existingSecret: ""

# Extra environment variables to inject into the Kellnr container.
# Accepts a list of raw Kubernetes EnvVar objects (supports value and valueFrom).
# Example:
#   extraEnvVars:
#     - name: AWS_REGION
#       value: "eu-central-1"
#     - name: MY_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: my-key
extraEnvVars: []
# Name of an existing ConfigMap with extra env vars, mounted via envFrom.
extraEnvVarsCM: ""
# Name of an existing Secret with extra env vars, mounted via envFrom.
extraEnvVarsSecret: ""

kellnr:
  setup:
    adminPwd: "admin"
    # When `name` is set, it takes precedence over the inline `adminPwd` above.
    adminPwdSecretRef:
      name: ""
      key: "adminPwd"
    adminToken: "Zy9HhJ02RJmg0GCrgLfaCVfU6IwDfhXD"
    # When `name` is set, it takes precedence over the inline `adminToken` above.
    adminTokenSecretRef:
      name: ""
      key: "adminToken"
  registry:
    dataDir: "/var/lib/kellnr"
    sessionAgeSeconds: null # 28800
    cacheSize: null # 1000
    maxCrateSize: null # 10
    authRequired: null # false
    requiredCrateFields: "" # Comma-separated list of fields, e.g. "description,license,repository"
    newCratesRestricted: null # false
    maxDbConnections: null # 0 means no limit

    # Allow publishing crates without an owner
    allowOwnerlessCrates: null # false

    token:
      cache:
        enabled: null # true
        ttlSeconds: null # 1800
        maxCapacity: null # 10000
      db:
        retryCount: null # 3
        retryDelayMs: null # 100

    # Crate download request handling
    downloadTimeoutSeconds: null # 60, 0 disables the timeout
    downloadMaxConcurrent: null # 20, 0 means unlimited
    downloadCounterFlushSeconds: null # 30, 0 flushes on every download

    # Failed logins per username within the window before Kellnr answers
    # with HTTP 429. Applies to the web login and cargo basic auth.
    authMaxFailedAttempts: null # 10, 0 disables the limit
    authFailedAttemptsWindowSeconds: null # 300

    # Used to sign the session cookie. Must be at least 64 characters.
    # Recommended for multi-replica setups so all replicas share the same key
    # (otherwise users are logged out when routed to a different replica).
    # If left empty, Kellnr generates a random key on startup (per pod).
    # Provide the value inline (stored in the chart-managed Secret) ...
    cookieSigningKey: ""
    # ... or reference an existing Secret holding the key. When `name` is set,
    # it takes precedence over the inline `cookieSigningKey` above.
    cookieSigningKeySecretRef:
      name: ""
      key: "cookieSigningKey"

  docs:
    # Building docs runs the build scripts and proc macros of every published
    # crate inside the Kellnr pod. Only enable it for trusted publishers.
    enabled: null # false
    maxSize: null # 100
    buildTimeoutSeconds: null # 1800, 0 disables the timeout
    # Command prefix for the docs build process, e.g. a sandbox like bubblewrap.
    buildWrapper: [] # e.g. ["bwrap", "--ro-bind", "/", "/", ...]
  proxy:
    enabled: null # false
    numThreads: null # 10
    downloadOnUpdate: null # false
    # Override to use a crates.io mirror instead of the public crates.io.
    url: null # "https://static.crates.io/crates/"
    index: null # "https://index.crates.io/"
    api: null # "https://crates.io/api/v1/crates/"
    connectTimeoutSeconds: null # 5
    requestTimeoutSeconds: null # 30
    userAgent: null # "kellnr.io/kellnr"
  log:
    level: null # "info"
    format: null # "compact"
    levelWebServer: null # "warn"
  local:
    ip: "0.0.0.0"
  origin:
    hostname: "localhost"
    # Can be a number, or null (~) to automatically set to 443 if protocol is https, otherwise 80
    port: null
    protocol: null # "http"
    # URL path prefix Kellnr is served under, e.g. "/kellnr".
    # Falls back to ingress.path if not set. Set it explicitly when using the HTTPRoute.
    path: null
    # Force the Secure flag on cookies, e.g. when TLS terminates at the ingress
    # while protocol is "http". null follows protocol.
    cookieSecure: null # true / false
  postgres:
    enabled: null # false
    address: null # "localhost"
    port: null # 5432
    db: null # "kellnr"
    user: ""
    pwd: ""
    pwdSecretRef:
      name: kellnr-postgres-user
      key: password
  s3:
    enabled: null # false
    accessKey: ""
    # When `name` is set, it takes precedence over the inline `accessKey` above.
    accessKeySecretRef:
      name: ""
      key: "accessKey"
    secretKey: ""
    # When `name` is set, it takes precedence over the inline `secretKey` above.
    secretKeySecretRef:
      name: ""
      key: "secretKey"
    region: ""
    endpoint: ""
    allowHttp: null # true
    crates_bucket: null # "kellnr-crates"
    cratesio_bucket: null # "kellnr-cratesio"
    # Docs are only stored in S3 when set; otherwise they stay on local disk.
    docs_bucket: null # e.g. "kellnr-docs"
    toolchain_bucket: null # "kellnr-toolchains"
    connectTimeoutSeconds: null # 5
    requestTimeoutSeconds: null # 30
  # Google Cloud Storage. Only one of s3 and gcs can be enabled.
  gcs:
    enabled: null # false
    # Credentials: without a service account key, Kellnr uses Application Default
    # Credentials, e.g. GKE Workload Identity via serviceAccount.annotations.
    serviceAccountKey: "" # service account key JSON
    # When `name` is set, it takes precedence over the inline `serviceAccountKey` above.
    serviceAccountKeySecretRef:
      name: ""
      key: "serviceAccountKey"
    endpoint: null # unset: public Google Cloud Storage API
    allowHttp: null # true
    # Skip request signing. Only for unauthenticated endpoints such as emulators.
    skipSignature: null # false
    crates_bucket: null # "kellnr-crates"
    cratesio_bucket: null # "kellnr-cratesio"
    # Docs are only stored in GCS when set; otherwise they stay on local disk.
    docs_bucket: null # e.g. "kellnr-docs"
    toolchain_bucket: null # "kellnr-toolchains"
    connectTimeoutSeconds: null # 5
    requestTimeoutSeconds: null # 30

  # OAuth2/OpenID Connect authentication
  # See https://kellnr.io/documentation for details
  oauth2:
    enabled: null # false
    # OIDC issuer URL (discovery URL)
    # Example: "https://authentik.example.com/application/o/kellnr/"
    issuerUrl: ""
    # OAuth2 client ID
    clientId: ""
    # OAuth2 client secret - prefer using clientSecretRef for production
    clientSecret: ""
    # Additional audiences accepted when the configured client ID is also present
    additionalAudiences: null # ["audience-one", "audience-two"]
    # Reference to an existing Kubernetes secret containing the client secret
    # When set, this takes precedence over clientSecret
    clientSecretRef:
      name: ""
      key: "client-secret"
    # OAuth2 scopes to request (comma-separated)
    scopes: null # "openid,profile,email"
    # Automatically create local user accounts for new OAuth2 users
    autoProvisionUsers: null # true
    # Claim name to check for admin group membership (e.g., "groups")
    adminGroupClaim: ""
    # Value in the admin group claim that grants admin privileges (e.g., "kellnr-admins")
    adminGroupValue: ""
    # Claim name to check for read-only group membership (e.g., "groups")
    readOnlyGroupClaim: ""
    # Value in the read-only group claim that grants read-only access (e.g., "kellnr-readonly")
    readOnlyGroupValue: ""
    # Text displayed on the OAuth2 login button
    buttonText: null # "Login with SSO"
    # Make SSO the only way to log in: disables local username/password login,
    # password resets/changes and local user creation. Requires `enabled`.
    enforced: null # false
    # Skip the login page and redirect straight to the identity provider. Requires `enforced`.
    autoRedirect: null # false

  toolchain:
    enabled: false
    maxSize: 500
  webhooks:
    # Also refuse webhook deliveries to loopback and private networks.
    # Link-local and cloud metadata addresses are always refused.
    blockPrivateTargets: null # false

service:
  api:
    type: ClusterIP
    port: 8000

pv:
  enabled: false
  name: "kellnr"
  storageClassName: "manual"
  storage: 5Gi
  path: ""

pvc:
  enabled: false
  name: "kellnr"
  storageClassName: "manual"
  storage: 5Gi

ingress:
  enabled: true
  className: ""
  annotations: {}
  # Path of the Ingress rule (defaults to "/"). Also Kellnr's path prefix if kellnr.origin.path is unset.
  path: ""
  pathType: Prefix
  tls:
    secretName: "kellnr-cert-secret"

httproute:
  enabled: false
  annotations: {}
  # Reference to the Gateway(s) that this HTTPRoute should attach to
  parentRefs:
    - name: ""
      namespace: ""
  # Override hostnames (defaults to kellnr.origin.hostname if not set)
  hostnames: []
  path: "/"
  pathType: "PathPrefix"
  # Optional: filters for request/response modification
  filters: []
  # Example filters:
  # - type: RequestHeaderModifier
  #   requestHeaderModifier:
  #     add:
  #       - name: X-Custom-Header
  #         value: custom-value

certificate:
  enabled: false
  secretName: "kellnr-cert-secret"
  issuerRef:
    name: ""
    kind: "ClusterIssuer"

importCert:
  enabled: false
  useExisting: false
  configMapName: "kellnr-cert"
  volumeName: "kellnr-cert-storage"
  certificate: ""

docBuilder:
  enabled: false
  rustupToolchain: "stable"
  registryName: kellnr
  configMapName: kellnr-doc-config
  # The token is passed to the docs build as CARGO_REGISTRIES_<NAME>_TOKEN and
  # is visible to the build scripts of the documented crates. Use a token of a
  # dedicated read-only user.
  tokenSecretRef:
    name: kellnr-doc-token
    key: token
  # Additional raw TOML appended to the generated Cargo config.toml.
  extraCargoConfig: ""

dns:
  enabled: false
  dnsPolicy: "None"
  dnsConfig:
    nameservers:
      - ""
    searches:
      - ""

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  target:
    CPUUtilizationPercentage: 80
    # memoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity: {}
